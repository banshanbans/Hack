name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web-backend-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/backend/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install -r services/backend/requirements-dev.txt
          npm --prefix apps/web ci

      - name: Repository and product checks
        run: make check

      - name: Backend tests
        run: PYTHONPATH=services python -m unittest discover -s services/backend/tests -v

      - name: Web checks and build
        run: |
          npm --prefix apps/web run typecheck
          npm --prefix apps/web test
          npm --prefix apps/web run build

      - name: Production image build
        run: docker build -f deploy/Dockerfile -t anju-app:ci .

  swift-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift package tests
        run: swift test --package-path packages/AnjuCore
