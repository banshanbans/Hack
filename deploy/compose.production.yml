name: anju

services:
  anju-app:
    image: anju-app:${ANJU_RELEASE:?ANJU_RELEASE is required}
    build:
      context: ..
      dockerfile: Dockerfile.production
    env_file:
      - ${ANJU_ENV_FILE:-/opt/anju/shared/.env.production}
    volumes:
      - /opt/anju/shared/data:/app/data
    networks:
      anju-internal:
        ipv4_address: 172.30.25.3
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          response=urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3);
          payload=json.load(response);
          assert response.status == 200 and payload.get('status') == 'ok' and payload.get('analysis') not in {'not_configured','demo'}
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      anju-app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      anju-internal:
        ipv4_address: 172.30.25.2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  anju-internal:
    ipam:
      config:
        - subnet: 172.30.25.0/24

volumes:
  caddy_data:
    external: true
    name: soloshot_caddy_data
  caddy_config:
